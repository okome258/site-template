# お米の最安値ウォッチ(準備中: いまは価格の記録だけ。ページは noindex)
site:
  name: "お米の最安値ウォッチ"
  tagline: "そのお米、今が買い時？"
  description: "楽天市場のお米を毎日記録し、1kgあたりの送料込み価格・過去最安値との差・レビューで買い時を判定します。"
  base_url: "https://kome.otokuest.com"
  theme_color: "#8a6d1f"
  cf_analytics_token: ""
  operator: "お米の最安値ウォッチ"

# 取得設定(キーワード数 × sorts × pages 回 API を呼ぶ。1秒1回)
# 価格推移を追うため、毎日ほぼ同じ商品が取れる並び順(レビュー件数順)を主にする
fetch:
  pages: 2
  hits: 30
  sorts: ["-reviewCount", "standard"]
  min_price: 1000
  max_price: 40000
  ng_keyword: "ふるさと納税 定期便"
  keywords: ["米 5kg", "米 10kg", "無洗米", "新米 精米", "玄米 10kg", "もち米"]

# 米以外・量が比べられないもの(玄米・もち米は記録して、種類列で分ける)
exclude: ["切り餅", "切餅", "丸餅", "鏡餅", "米粉", "米ぬか", "パックご飯", "レトルト", "ご飯", "おにぎり",
          "甘酒", "米油", "米麹", "麹", "日本酒", "焼酎", "せんべい", "煎餅", "クッキー", "お試し",
          "サンプル", "定期便", "ふるさと納税"]
require: ["米", "コシヒカリ", "あきたこまち", "ひとめぼれ", "ななつぼし", "つや姫", "ゆめぴりか", "はえぬき", "きぬむすめ", "ヒノヒカリ", "青天の霹靂", "新之助"]   # 銘柄名だけの商品も拾う
qty_range: [1, 40]   # 1件の総量(kg)として妥当な範囲。外れたら読み違いとして捨てる

# 種類の判定(上から順に、商品名に含まれていたらその種類。どれにも当たらなければ白米)
kinds:
  - [genmai, ["玄米"]]
  - [mochi, ["もち米", "餅米", "糯米"]]
  - [musen, ["無洗米"]]
