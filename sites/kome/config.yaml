# お米の最安値ウォッチ(楽天市場のお米を毎日記録し、1kgあたりの値段で比べる)
site:
  name: "お米の最安値ウォッチ"
  tagline: "そのお米、今が買い時？"
  description: "楽天市場のお米を毎朝集めて、送料込みの1kgあたりの値段で安い順に並べています。白米・無洗米・玄米・もち米を、5kg・10kg・20kg以上に分けて比較。"
  base_url: "https://kome.otokuest.com"
  theme_color: "#8a6d1f"
  cf_analytics_token: ""
  operator: "お米の最安値ウォッチ"

# 取得設定(キーワード数 × sorts × pages 回 API を呼ぶ。1秒1回)
# 価格推移を追うため、毎日ほぼ同じ商品が取れる並び順(レビュー件数順)を主にする
fetch:
  pages: 2
  hits: 30
  sorts: ["-reviewCount", "standard"]
  min_price: 1000
  max_price: 40000
  ng_keyword: "ふるさと納税 定期便"
  keywords: ["米 5kg", "米 10kg", "無洗米", "新米 精米", "玄米 10kg", "もち米"]

# 米以外・量が比べられないもの(玄米・もち米は記録して、種類列で分ける)
exclude: ["切り餅", "切餅", "丸餅", "鏡餅", "米粉", "米ぬか", "パックご飯", "レトルト", "ご飯", "おにぎり",
          "甘酒", "米油", "米麹", "麹", "日本酒", "焼酎", "せんべい", "煎餅", "クッキー", "お試し",
          "サンプル", "定期便", "ふるさと納税"]
require: ["米", "コシヒカリ", "あきたこまち", "ひとめぼれ", "ななつぼし", "つや姫", "ゆめぴりか", "はえぬき", "きぬむすめ", "ヒノヒカリ", "青天の霹靂", "新之助"]   # 銘柄名だけの商品も拾う
qty_range: [1, 40]   # 1件の総量(kg)として妥当な範囲。外れたら読み違いとして捨てる

# 銘柄(商品名に入っていたら表示する。上から順に最初の1つ)
brands: ["コシヒカリ", "あきたこまち", "ひとめぼれ", "ななつぼし", "つや姫", "ゆめぴりか", "はえぬき",
         "きぬむすめ", "ヒノヒカリ", "青天の霹靂", "新之助", "ミルキークイーン", "森のくまさん", "雪若丸",
         "銀河のしずく", "にこまる", "夢つくし", "さがびより", "まっしぐら", "ふさこがね", "こしいぶき"]

# 量の帯。この中で1kgあたりの値段を比べる(帯に入らない量の商品は順位に出さない)
bands:
  - {id: "5", label: "5kg前後", min: 4, max: 6.5}
  - {id: "10", label: "10kg前後", min: 8, max: 12.5}
  - {id: "20", label: "20kg以上", min: 18, max: 40}
top_n: 15

# 種類ごとのページ
kinds_meta:
  - id: hakumai
    path: index.html
    name: 白米
    title: "お米の最安値 白米を1kgあたりの値段で比較"
    h1: "白米、いま1kgいくら？"
    description: "楽天市場の白米を、送料込みの1kgあたりの値段で安い順に。5kg・10kg・20kg以上に分けて毎朝更新しています。"
  - id: musen
    path: musen/index.html
    name: 無洗米
    title: "無洗米の最安値 1kgあたりの値段で比較"
    h1: "無洗米、いま1kgいくら？"
    description: "楽天市場の無洗米を、送料込みの1kgあたりの値段で安い順に。5kg・10kg・20kg以上に分けて毎朝更新しています。"
  - id: genmai
    path: genmai/index.html
    name: 玄米
    title: "玄米の最安値 1kgあたりの値段で比較"
    h1: "玄米、いま1kgいくら？"
    description: "楽天市場の玄米を、送料込みの1kgあたりの値段で安い順に。精米を選べる玄米も含めて毎朝更新しています。"
    note: "「精米も選べる」は、玄米の重さで売っていて、注文時に白米などへの精米を頼めるものです。白米にすると重さは1割ほど減ります。"
  - id: mochi
    path: mochi/index.html
    name: もち米
    title: "もち米の最安値 1kgあたりの値段で比較"
    h1: "もち米、いま1kgいくら？"
    description: "楽天市場のもち米を、送料込みの1kgあたりの値段で安い順に。年末の餅つき用に、5kg・10kg・20kg以上に分けて毎朝更新しています。"
