{% extends "base.html" %}
{% block head %}
<style>
.bar{position:relative;height:8px;background:var(--panel);border-radius:4px;margin-top:4px;min-width:60px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.up{color:#b4442d}.down{color:#2f6f9a}.muted{color:var(--muted)}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.kpi div{background:var(--panel);border-radius:10px;padding:10px 12px}
.kpi dt{font-size:12px;color:var(--muted)}.kpi dd{margin:2px 0 0;font-size:20px;font-weight:900;font-family:var(--head)}
.kpi dd small{font-size:12px;font-weight:400;margin-left:2px}
@media(min-width:640px){.kpi{grid-template-columns:repeat(4,1fr)}}
.trend{width:100%;max-width:560px;height:auto}
.trend text{font-size:11px;fill:var(--muted)}.trend .val{fill:var(--ink);font-weight:700}
.trend rect{fill:var(--accent)}.trend .avg{stroke:var(--muted);stroke-dasharray:4 3}
.jobs a{margin:4px 6px 4px 0}
.sub{display:block;font-size:12px;font-weight:400;color:var(--muted);font-family:inherit}
@media(min-width:640px){.sub.sp{display:none}}
.navs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.navs a{flex:1 1 140px;display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--panel)}
.navs a b{display:block;color:var(--accent)}.navs a small{color:var(--muted)}
.board.compact th,.board.compact td{padding:8px 5px}
.wrap-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 地図: このサイトは青系。濃いほど実質時給が高い */
.map-box{margin:12px 0 18px}
.jp-big .lv1 rect,.lv.lv1{fill:#dbe6f1;background:#dbe6f1}
.jp-big .lv2 rect,.lv.lv2{fill:#a9c3dd;background:#a9c3dd}
.jp-big .lv3 rect,.lv.lv3{fill:#5f8cb8;background:#5f8cb8}
.jp-big .lv4 rect,.lv.lv4{fill:#2f5d8a;background:#2f5d8a}
.jp-big text{fill:#334}
.legend .lv{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin:0 2px}
tr:target{background:#fff4c4}
/* ランキングの切り替えタブ(業界/注目の業種/都道府県) */
.rk-tabs>input{position:absolute;opacity:0;pointer-events:none}
.rk-bar{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:8px 0;background:var(--bg,#fff);border-bottom:2px solid var(--ink);margin:8px 0 10px}
.rk-bar label,.rk-bar a{flex:1;text-align:center;padding:9px 4px;border-radius:10px 10px 0 0;background:var(--panel);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.rk-bar small{font-weight:400;color:var(--muted);font-size:11px}
.rk-panel{display:none}
#rk-gyokai:checked~.rk-p1,#rk-gyoshu:checked~.rk-p2{display:block}
#rk-gyokai:checked~.rk-bar label[for=rk-gyokai],#rk-gyoshu:checked~.rk-bar label[for=rk-gyoshu]{background:var(--accent);color:#fff}
#rk-gyokai:checked~.rk-bar label[for=rk-gyokai] small,#rk-gyoshu:checked~.rk-bar label[for=rk-gyoshu] small{color:#dde8f3}
/* AI時代ページ */
.ai{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;white-space:nowrap}
.ai3{background:#f6d6cb;color:#8a2e17}.ai2{background:#f3ead0;color:#6b5410}.ai1{background:#dbe6f1;color:#234a70}
.updown{display:grid;grid-template-columns:1fr;gap:4px 16px}
@media(min-width:640px){.updown{grid-template-columns:1fr 1fr}}
.updown h3{font-size:15px;margin:8px 0 4px}.updown ol{margin:0;padding-left:22px}.updown li{margin:5px 0}
.occ tr.sub th{padding-left:20px;font-weight:400;font-size:13px}
.occ tr.maj th{font-weight:700}
/* マスコット「ヤドキャリ」のふきだし */
.yc-say{display:flex;align-items:flex-end;gap:10px;margin:10px 0 16px}
.yc-say img{flex:none;height:auto}
.yc-say p{position:relative;margin:0 0 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.7}
.yc-say p::before{content:"";position:absolute;left:-7px;bottom:14px;width:12px;height:12px;background:var(--panel);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.yc-say b.nm{display:block;font-size:12px;color:var(--accent)}
.yc-hero{display:flex;align-items:center;gap:12px}
.yc-hero img{width:110px;height:auto;flex:none}
@media(min-width:640px){.yc-hero img{width:150px}}
html{scroll-padding-top:60px}
</style>
{% endblock %}
{% block footer_extra %}
<p class="small"><a href="{{ page.root }}about/">このサイトについて・計算方法</a></p>
<p class="small">出典: 厚生労働省「賃金構造基本統計調査」(一般労働者・企業規模10人以上・男女計)を加工して作成。2023年以前はe-Statのデータベース、2024年以降はe-Statで公開されている統計表(Excel)から取得しています。このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。</p>
{% endblock %}
