{% extends "base.html" %}
{% block head %}
<style>
.bar{position:relative;height:8px;background:var(--panel);border-radius:4px;margin-top:4px;min-width:60px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.up{color:#b4442d}.down{color:#2f6f9a}.muted{color:var(--muted)}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.kpi div{background:var(--panel);border-radius:10px;padding:10px 12px}
.kpi dt{font-size:12px;color:var(--muted)}.kpi dd{margin:2px 0 0;font-size:20px;font-weight:900;font-family:var(--head)}
.kpi dd small{font-size:12px;font-weight:400;margin-left:2px}
@media(min-width:640px){.kpi{grid-template-columns:repeat(4,1fr)}}
.trend{width:100%;max-width:560px;height:auto}
.trend text{font-size:11px;fill:var(--muted)}.trend .val{fill:var(--ink);font-weight:700}
.trend rect{fill:var(--accent)}.trend .avg{stroke:var(--muted);stroke-dasharray:4 3}
.jobs a{margin:4px 6px 4px 0}
.sub{display:block;font-size:12px;font-weight:400;color:var(--muted);font-family:inherit}
@media(min-width:640px){.sub.sp{display:none}}
.navs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.navs a{flex:1 1 140px;display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--panel)}
.navs a b{display:block;color:var(--accent)}.navs a small{color:var(--muted)}
.board.compact th,.board.compact td{padding:8px 5px}
.wrap-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 地図: このサイトは青系。濃いほど実質時給が高い */
.map-box{margin:12px 0 18px}
.jp-big .lv1 rect,.lv.lv1{fill:#dbe6f1;background:#dbe6f1}
.jp-big .lv2 rect,.lv.lv2{fill:#a9c3dd;background:#a9c3dd}
.jp-big .lv3 rect,.lv.lv3{fill:#5f8cb8;background:#5f8cb8}
.jp-big .lv4 rect,.lv.lv4{fill:#2f5d8a;background:#2f5d8a}
.jp-big text{fill:#334}
.legend .lv{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin:0 2px}
tr:target{background:#fff4c4}
/* ランキングの切り替えタブ(業界/注目の業種/都道府県) */
.rk-tabs>input{position:absolute;opacity:0;pointer-events:none}
.rk-bar{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:8px 0;background:var(--bg,#fff);border-bottom:2px solid var(--ink);margin:8px 0 10px}
.rk-bar label,.rk-bar a{flex:1;text-align:center;padding:9px 4px;border-radius:10px 10px 0 0;background:var(--panel);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.rk-bar small{font-weight:400;color:var(--muted);font-size:11px}
.rk-panel{display:none}
.rk-tabs>input:nth-of-type(1):checked~.rk-p1,.rk-tabs>input:nth-of-type(2):checked~.rk-p2{display:block}
.rk-tabs>input:nth-of-type(1):checked~.rk-bar label:nth-of-type(1),.rk-tabs>input:nth-of-type(2):checked~.rk-bar label:nth-of-type(2){background:var(--accent);color:#fff}
.rk-tabs>input:nth-of-type(1):checked~.rk-bar label:nth-of-type(1) small,.rk-tabs>input:nth-of-type(2):checked~.rk-bar label:nth-of-type(2) small{color:#dde8f3}
/* AI時代ページ */
.ai{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;white-space:nowrap}
.ai3{background:#f6d6cb;color:#8a2e17}.ai2{background:#f3ead0;color:#6b5410}.ai1{background:#dbe6f1;color:#234a70}
.updown{display:grid;grid-template-columns:1fr;gap:4px 16px}
@media(min-width:640px){.updown{grid-template-columns:1fr 1fr}}
.updown h3{font-size:15px;margin:8px 0 4px}.updown ol{margin:0;padding-left:22px}.updown li{margin:5px 0}
.occ tr.sub th{padding-left:20px;font-weight:400;font-size:13px}
.occ tr.maj th{font-weight:700}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:5px 0 2px;background:var(--panel);max-width:220px}
.mix.big{height:14px;max-width:none;margin:8px 0 12px}
.mix i{display:block;height:100%}
.m3{background:#d4705a}.m2{background:#e3c46b}.m1{background:#7fa6cc}
.mixk{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin:0 2px}
.simbox{background:var(--panel);border-radius:12px;padding:12px 14px;margin:12px 0}
.simbox label{display:block;font-weight:700;margin-bottom:6px}
.simbox input[type=range]{width:100%;accent-color:var(--accent)}
.simbox #ai-xv{color:var(--accent);font-size:20px}
.aisim td.num b{font-size:15px}
.ai-hero{display:flex;align-items:center;gap:12px;margin:6px 0 14px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#2f5d8a,#4a7fb3);color:#fff;text-decoration:none}
.ai-hero img{width:76px;height:auto;flex:none}
.ai-hero b{display:block;font-size:17px;line-height:1.4}
.ai-hero small{display:block;font-size:12px;opacity:.9;margin-top:3px}
.ai-hero i{font-style:normal;font-size:26px;margin-left:auto;opacity:.8}
.adopt{margin:8px 0}
.arow{display:grid;grid-template-columns:7.5em 1fr 3.6em;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.ab{display:flex;height:12px;background:var(--panel);border-radius:6px;overflow:hidden}
.ab i{display:block;height:100%}.ab .a0{background:#7fa6cc}.ab .a1{background:#2f5d8a}
.av{text-align:right;font-weight:700}
.caveat{border-left:4px solid #e3c46b;background:#fbf6e6;padding:10px 12px;border-radius:6px;font-size:14px;line-height:1.7;margin:12px 0}
details.more{margin:10px 0}details.more summary{cursor:pointer;color:var(--accent);font-weight:700;padding:6px 0}
.dash th small,.dash td small{font-weight:400;color:var(--muted)}
.answer{border:2px solid var(--accent);border-radius:14px;padding:12px 14px 6px;margin:12px 0}
.answer .ah{margin:0 0 4px;font-weight:900;color:var(--accent)}
.answer ol{margin:0;padding-left:20px}.answer li{margin:0 0 8px;line-height:1.7}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.toc a{font-size:13px;padding:5px 10px;border-radius:16px;background:var(--panel);color:var(--ink);text-decoration:none;border:1px solid var(--line)}
.jobcards{list-style:none;padding:0;margin:10px 0;counter-reset:jc;display:grid;gap:8px}
@media(min-width:640px){.jobcards{grid-template-columns:1fr 1fr}}
.jobcards li{counter-increment:jc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative}
.jobcards li::before{content:counter(jc);position:absolute;left:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.jc-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.jc-n{font-weight:700}.jc-v{color:#b4442d;font-size:20px;font-family:var(--head)}.jc-v small{font-size:12px}
.jc-m{margin:4px 0}
.jc-q{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.jc-q span{font-size:12px;background:#eef3f8;color:#234a70;border-radius:6px;padding:2px 7px}
.risky{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px}
.risky li{display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding:6px 0}
.risky li span{flex:1}.risky small{font-size:12px}
details.big>summary{display:block;text-align:center;border:1px solid var(--accent);border-radius:10px;padding:10px;margin:8px 0}
.sortbar{display:flex;gap:6px;margin:6px 0 4px;flex-wrap:wrap}
.sortbar button{font:inherit;font-size:12px;padding:5px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.sortbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rk-tabs>input:nth-of-type(3):checked~.rk-p3{display:block}
.rk-links{position:static}.rk-links a.on{background:var(--accent);color:#fff}
.rk-tabs>input:nth-of-type(3):checked~.rk-bar label:nth-of-type(3){background:var(--accent);color:#fff}
.rk-tabs>input:nth-of-type(3):checked~.rk-bar label:nth-of-type(3) small{color:#dde8f3}
details.why{background:#fbf6e6;border-radius:10px;padding:8px 12px;margin:10px 0}
details.why summary{cursor:pointer;font-weight:700;font-size:14px}
details.why p{margin:8px 0 4px;line-height:1.7}
/* マスコット「ヤドキャリ」のふきだし */
.yc-say{display:flex;align-items:flex-end;gap:10px;margin:10px 0 16px}
.yc-say img{flex:none;height:auto}
.yc-say p{position:relative;margin:0 0 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.7}
.yc-say p::before{content:"";position:absolute;left:-7px;bottom:14px;width:12px;height:12px;background:var(--panel);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.yc-say b.nm{display:block;font-size:12px;color:var(--accent)}
.yc-hero{display:flex;align-items:center;gap:12px}
.yc-hero img{width:110px;height:auto;flex:none}
@media(min-width:640px){.yc-hero img{width:150px}}
html{scroll-padding-top:60px}
</style>
{% endblock %}
{% block footer_extra %}
<script>
document.querySelectorAll(".sortbar").forEach(function(bar){
  var tb=document.getElementById(bar.dataset.target);if(!tb)return;
  bar.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
    var k=b.dataset.k,asc=b.dataset.asc==="1",rows=[].slice.call(tb.querySelectorAll("tbody tr"));
    rows.sort(function(x,y){return (asc?1:-1)*((+x.dataset[k]||0)-(+y.dataset[k]||0));});
    rows.forEach(function(r,i){tb.querySelector("tbody").appendChild(r);var c=r.querySelector("td.rk");if(c)c.textContent=i+1;});
    bar.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b)});});
});
</script>
<p class="small"><a href="{{ page.root }}about/">このサイトについて・計算方法</a></p>
<p class="small">出典: 厚生労働省「賃金構造基本統計調査」(一般労働者・企業規模10人以上・男女計)を加工して作成。2023年以前はe-Statのデータベース、2024年以降はe-Statで公開されている統計表(Excel)から取得しています。このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。</p>
{% endblock %}
