{% extends "base.html" %}
{% block head %}
<style>
.bar{position:relative;height:8px;background:var(--panel);border-radius:4px;margin-top:4px;min-width:60px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.up{color:#b4442d}.down{color:#2f6f9a}.muted{color:var(--muted)}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.kpi div{background:var(--panel);border-radius:10px;padding:10px 12px}
.kpi dt{font-size:12px;color:var(--muted)}.kpi dd{margin:2px 0 0;font-size:20px;font-weight:900;font-family:var(--head)}
.kpi dd small{font-size:12px;font-weight:400;margin-left:2px}
@media(min-width:640px){.kpi{grid-template-columns:repeat(4,1fr)}}
.trend{width:100%;max-width:560px;height:auto}
.trend text{font-size:11px;fill:var(--muted)}.trend .val{fill:var(--ink);font-weight:700}
.trend rect{fill:var(--accent)}.trend .avg{stroke:var(--muted);stroke-dasharray:4 3}
.jobs a{margin:4px 6px 4px 0}
</style>
{% endblock %}
{% block footer_extra %}
<p class="small"><a href="{{ page.root }}about/">このサイトについて・計算方法</a></p>
<p class="small">出典: 厚生労働省「賃金構造基本統計調査」(一般労働者・企業規模10人以上・男女計)を加工して作成。このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。</p>
{% endblock %}
