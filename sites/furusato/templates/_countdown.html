{# 締め切りのひとこと(ヘッダーの更新日の横に小さく)。10〜12月と1/1〜1/10だけ表示 #}
<span class="deadline" id="deadline" hidden></span>
<script>
(function(){try{
  var now=new Date(Date.now()+9*3600e3), y=now.getUTCFullYear(), m=now.getUTCMonth()+1, d=now.getUTCDate();
  var today=Date.UTC(y,m-1,d), el=document.getElementById('deadline'); if(!el) return;
  function days(t){return Math.round((t-today)/864e5);}
  var txt;
  if(m>=10){ var n=days(Date.UTC(y,11,31)); txt= n<=0 ? '今年の締め切りは今日まで' : '今年の締め切り12/31まであと'+n+'日'; }
  else if(m==1 && d<=10){ var n2=days(Date.UTC(y,0,10)); txt= n2<=0 ? 'ワンストップ特例は今日必着' : 'ワンストップ特例の申請は1/10必着（あと'+n2+'日）'; }
  else return;
  el.textContent=txt; el.hidden=false;
}catch(e){}})();
</script>
