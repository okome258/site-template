<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="ふくら雀のふくすけ">
  <ellipse cx="120" cy="190" rx="82" ry="7" fill="#000" opacity=".07"/>
  <!-- ふわふわの白いからだ(横に広いおまんじゅう形。ふちを小さく波打たせて羽毛感) -->
  <path d="M120 22
           C170 22 206 54 214 98 q4 4 2 10 q4 6 0 12 C210 160 172 186 120 186
           C68 186 30 160 24 120 q-4 -6 0 -12 q-2 -6 2 -10 C34 54 70 22 120 22z"
        fill="#f6f0e6" stroke="#3a2e26" stroke-width="3" stroke-linejoin="round"/>
  <!-- 左右の羽(茶色、ふっくら抱えるように) -->
  <path d="M30 96 C20 128 34 160 66 170 C60 150 58 124 64 102 C52 92 40 90 30 96z" fill="#a8693c" stroke="#3a2e26" stroke-width="3" stroke-linejoin="round"/>
  <path d="M210 96 C220 128 206 160 174 170 C180 150 182 124 176 102 C188 92 200 90 210 96z" fill="#a8693c" stroke="#3a2e26" stroke-width="3" stroke-linejoin="round"/>
  <path d="M38 112 q8 4 14 14 M36 130 q8 4 14 14 M44 148 q6 4 10 10" stroke="#3a2e26" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M202 112 q-8 4 -14 14 M204 130 q-8 4 -14 14 M196 148 q-6 4 -10 10" stroke="#3a2e26" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 栗色の頭 -->
  <path d="M120 22 C158 22 186 40 196 66 C176 56 150 52 120 52 C90 52 64 56 44 66 C54 40 82 22 120 22z" fill="#9b4a26" stroke="#3a2e26" stroke-width="3" stroke-linejoin="round"/>
  <!-- 黒い頬斑 -->
  <ellipse cx="62" cy="92" rx="11" ry="9" fill="#2a2420"/>
  <ellipse cx="178" cy="92" rx="11" ry="9" fill="#2a2420"/>
  <!-- 目: にっこり閉じ目 -->
  <path d="M84 76 q10 -10 20 0" stroke="#2a2420" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M136 76 q10 -10 20 0" stroke="#2a2420" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- ほっぺの赤み -->
  <ellipse cx="84" cy="96" rx="9" ry="5" fill="#ef8f7a" opacity=".55"/>
  <ellipse cx="156" cy="96" rx="9" ry="5" fill="#ef8f7a" opacity=".55"/>
  <!-- 黒いよだれかけ(のど) -->
  <path d="M104 92 C108 106 114 114 120 116 C126 114 132 106 136 92 C126 96 114 96 104 92z" fill="#2a2420"/>
  <!-- くちばし(にっこり口に見える小さめ) -->
  <path d="M110 82 Q120 78 130 82 Q126 94 120 96 Q114 94 110 82z" fill="#8c8580" stroke="#3a2e26" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- おなかの羽毛のふち -->
  <path d="M96 150 q6 6 12 0 q6 6 12 0 q6 6 12 0 q6 6 12 0" stroke="#d9cdbb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- あし -->
  <path d="M100 184 l-6 8 M100 184 l0 9 M100 184 l6 8 M140 184 l-6 8 M140 184 l0 9 M140 184 l6 8" stroke="#d68a3a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 頭にお米ひと粒 -->
  <ellipse cx="136" cy="18" rx="5.5" ry="9" transform="rotate(25 136 18)" fill="#fffaf0" stroke="#3a2e26" stroke-width="2"/>
</svg>
