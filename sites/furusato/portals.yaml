# ポイント禁止(2025年10月)後、各ポータルがポイントの代わりにやっていること
# checked: 確認日 / source_type: official=公式・プレスリリース, secondary=比較サイト等の二次情報(公開前に公式で要確認)
# url: 公式トップ(広告なし) / 楽天とau PAYはページ側でアフィリンクに差し替える
# campaign は期間限定。表示時は「時期によって変わります」を必ず添える

portals:
  - id: rakuten
    url: https://event.rakuten.co.jp/furusato/
    name: 楽天ふるさと納税
    standing: 楽天カードで払えばカードの通常ポイントはつく。買い回りやSPUは対象外になった
    campaign: 5と0のつく日にエントリーして楽天カードで払うと+1倍(月の上限1,000pt)
    merit:
      - 楽天IDでそのまま寄付できる
      - 返礼品とレビューが多く、選びやすい
    demerit:
      - 以前のような高いポイント付与はもうない。ポイントは楽天カード頼み
      - 5と0の日は当日エントリーが必要で、上限も低め
    suited: 楽天カードを持っていて、楽天のレビューで選びたい人
    checked: 2026-10-10
    source_type: secondary
    source: https://pricey.jp/web/articles/4326

  - id: furunavi
    url: https://furunavi.jp/
    name: ふるなび
    standing: 2025年12月に始めた「ふるなびマネー」で払う。チャージ分は有効期限なし
    campaign: チャージ時の5%増量をかなりの頻度で実施(内訳は4%+期間限定1%)
    merit:
      - 増量率は今の主要サイトでいちばん高い水準
      - 寄付額を指定すると、増量分を引いたチャージ額を自動で出してくれる
    demerit:
      - 増量分の一部は1年で期限切れ
      - キャンペーン期間外だと増量なし。ふるなびの中でしか使えない
    suited: 寄付額が大きく、ふるなびに欲しい返礼品がある人
    checked: 2026-10-10
    source_type: official
    source: https://webtan.impress.co.jp/r/prtimes/items/000001610.000007821

  - id: aupay
    url: https://furusato.wowma.jp/
    name: au PAY ふるさと納税
    standing: 手持ちのPontaポイントをauのポイント交換サービスで増やしてから寄付に使える(新たにもらう仕組みではない)
    campaign: 交換レートは基本1.1倍、au・UQなどの条件で月の上限まで1.5倍
    merit:
      - Pontaが貯まっている人にはかなり強い
      - au PAY(auかんたん決済)でも払える
    demerit:
      - 交換後のポイントはau PAY マーケット限定で、30日で期限切れ
      - Pontaを持っていない人にはメリットが薄い
    suited: au・UQユーザー、Pontaをよく貯めている人
    checked: 2026-10-10
    source_type: secondary
    source: https://money-lifehack.com/?p=18535

  - id: yahoo
    url: https://furusato.yahoo.co.jp/
    name: Yahoo!ふるさと納税
    standing: ヤフーショッピング商品券で寄付を払える
    campaign: 商品券の増量キャンペーン(月によって4〜8%程度。2026年9月は6%)
    merit:
      - 増量率が高い月はふるなびと並ぶ
      - 寄付先と金額が決まっていれば手間が少ない
    demerit:
      - 受け取りまで30日、受け取ってから使うまで30日と期限が短い
      - 2026年7月から、商品券で払った分は買い物キャンペーンのポイント対象外
    suited: 寄付先が決まっていて、期限内にさっと使い切れる人
    checked: 2026-10-10
    source_type: secondary
    source: https://money-lifehack.com/diary/24823

  - id: choice
    url: https://www.furusato-tax.jp/
    name: ふるさとチョイス
    standing: 特典より「寄付金の使い道」や地域支援を前に出す方針。ポイント禁止にも賛成していた
    campaign: 感謝券コードで寄付額500円OFFという情報あり(要公式確認)
    merit:
      - 使い道を選んで寄付したい人、災害支援寄付をしたい人に向く
    demerit:
      - 金銭的な特典は他サイトより控えめ
    suited: 返礼品より応援先で選びたい人
    checked: 2026-10-10
    source_type: secondary
    source: https://www.businessinsider.jp/article/290572/

  - id: satofull
    url: https://www.satofull.jp/
    name: さとふる
    standing: 新しいポイント付与は終了。持っているポイントは期限内ならPayPayポイント・Amazonギフトカードへの交換や寄付に使える。今回の調査では常設の代わりの特典は見当たらず
    campaign: なし(要公式確認)
    merit:
      - 支払い方法が多い(PayPay、Amazon Pay、メルペイ、d払い、楽天ペイなど)
    demerit:
      - 増量・ポイント付与系の施策は今のところ目立たない
    suited: 普段使いの決済で払いたい人
    checked: 2026-10-10
    source_type: official
    source: https://origin.digitalpr.jp/pdf.php?r=117011

  - id: amazon
    url: https://www.amazon.co.jp/s?k=ふるさと納税
    name: Amazonふるさと納税
    standing: 寄付に応じたポイントはつかない。いつものAmazonアカウントで寄付でき、最短翌日に届く返礼品があるのが強み
    campaign: 2026年9月24日〜10月19日の「ふるさとまつり」は、エントリーすると抽選で最大12,000ポイント(寄付しなくても参加できる抽選)
    merit:
      - Amazonのアカウント・住所・支払い方法のまま寄付できて手軽
      - 最短翌日配送の返礼品があり、届くのが早い
    demerit:
      - ポイントはもらえない。キャンペーンも抽選なので必ず得するわけではない
      - お届け日を指定できるかは返礼品ごとに違う
    suited: Amazonをよく使っていて、早く届けてほしい人
    checked: 2026-10-11
    source_type: secondary
    source: https://appllio.com/amazon-primeappreciation-furusatomatsuri-week

  - id: furulab
    url: https://furusato.asahi.co.jp/
    name: ふるラボ
    standing: 朝日放送テレビが運営。ポイントや増量の代わりに、テレビ番組での返礼品紹介や、番組と地域で共同開発した返礼品を前に出している
    campaign: 金銭的な特典は今回の調査では見当たらず(要公式確認)
    merit:
      - 旅番組などで紹介された返礼品を探しやすい
      - 動画や特集ページで、地域や返礼品の背景を知ってから選べる
    demerit:
      - 増量・ポイント系の特典は目立たない
      - 後発のため、大手より掲載数は少なめ
    suited: テレビで見た返礼品や、地域の話を知ってから寄付したい人
    checked: 2026-10-17
    source_type: official
    source: https://netshop.impress.co.jp/r/prtimes/items/000000068.000062174

  - id: honpo
    url: https://furusatohonpo.jp/
    name: ふるさと本舗
    standing: 常設の代わりの特典は見当たらず、期間限定のキャンペーンで対応
    campaign: 2026年10月31日まで、寄付時にキャンペーンコードを入れてアンケートに答えるとAmazonギフト券500円分という情報あり(要公式確認)
    merit:
      - 「おいしい」を前に出した食べ物中心の品ぞろえ
    demerit:
      - 常設の増量・ポイント系の特典はない
      - キャンペーンは期間と条件つき
    suited: 食べ物の返礼品を中心に探したい人
    checked: 2026-10-17
    source_type: secondary
    source: https://furu-sato.com/magazine/42750/
