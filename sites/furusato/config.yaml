site:
  name: "ふるさと納税 量コスパ比較"
  tagline: "寄付1万円あたり、どれだけ届く？"
  logo_img: "fukusuke-face.png"   # マスコット「ふくすけ」(ふくら雀)
  favicon: "favicon-64.png"
  apple_touch_icon: "apple-touch-icon.png"
  og_image: "ogp.png"   # SNSでシェアされた時の画像(static/ に置く)
  description: "楽天ふるさと納税の返礼品を「寄付1万円あたりの量」で毎日自動ランキング。お米・肉・海鮮・トイレットペーパー・水など、量で選びたい人のための比較サイト。"
  base_url: "https://furusato.otokuest.com"
  theme_color: "#b23a2a"   # 紅(紅白でおめでたい)
  google_site_verification: "SC7yeTNVBtuerKfU-OZfA9tPcD6pXcqacd6m4AzjHY8"  # Search Console
  cf_analytics_token: "51a79abed12a41eea0d2cb216a642808"   # Cloudflare Web Analytics
  operator: "ふるさと納税 量コスパ比較"
  amazon_tag: ""   # AmazonアソシエイトのトラッキングID(例: okome-22)。入れるとAmazonリンクがPR付きのアフィリンクになる

# 取得設定(1カテゴリ = キーワード数 × sorts × pages 回 API を呼ぶ。1秒1回)
fetch:
  pages: 2
  hits: 30
  sorts: ["standard", "-reviewCount"]
  min_price: 5000
  max_price: 100000
  ng_keyword: "定期便"     # 定期便は寄付額と1回分の量が対応しないので除外
  top_n: 30

# unit_kind: weight(kg) / volume(L) / count(count_units の個数)
# scale: 表示単位への倍率(いくらを g で見せるなら 1000)
# range: 1件あたりの総量として妥当な範囲(表示単位。外れたら読み違いとして捨てる)
# サイト上の並び順: top の10個を人気順に固定表示し、残りは「その他のカテゴリ」にグループ別で並べる
# よく寄付される定番ジャンル(この順でタブ・一覧に出る)
top: [rice, beef, pork, crab, scallop, ikura, unagi, chicken, toilet, beer]

# 旬の特集。取得日の月で自動で切り替わる(目立つ枠で一番上に出す)
seasons:
  - name: 秋の味覚
    months: [9, 10, 11]
    lead: 新米・シャインマスカット・りんご・いくらが旬。
    cats: [rice, shine, apple, ikura, salmon]
  - name: 冬のごちそう
    months: [12, 1, 2]
    lead: カニ・牡蠣・みかん・いちごがおいしい季節。
    cats: [crab, oyster, mikan, strawberry, ikura]
  - name: 春の味覚
    months: [3, 4, 5]
    lead: いちごと、新生活に役立つ日用品。
    cats: [strawberry, tuna, toilet, detergent, rice]
  - name: 夏のごちそう
    months: [6, 7, 8]
    lead: 桃・メロン・土用のうなぎ、冷えたビール。
    cats: [peach, melon, unagi, beer, sparkling]

