site:
  name: "ふるさと納税 量コスパ比較"
  tagline: "寄付1万円あたり、どれだけ届く？"
  description: "楽天ふるさと納税の返礼品を「寄付1万円あたりの量」で毎日自動ランキング。お米・肉・海鮮・トイレットペーパー・水など、量で選びたい人のための比較サイト。"
  base_url: "https://furusato-kosupa.okomen.workers.dev"
  theme_color: "#1f6f5c"
  google_site_verification: ""  # Search Console の確認タグの content の値
  cf_analytics_token: ""   # Cloudflare Web Analytics のトークンを入れると計測開始
  operator: "ふるさと納税 量コスパ比較"

# 取得設定(1カテゴリ = キーワード数 × sorts × pages 回 API を呼ぶ。1秒1回)
fetch:
  pages: 2
  hits: 30
  sorts: ["standard", "-reviewCount"]
  min_price: 5000
  max_price: 100000
  ng_keyword: "定期便"     # 定期便は寄付額と1回分の量が対応しないので除外
  top_n: 30

# unit_kind: weight(kg) / volume(L) / count(count_units の個数)
# scale: 表示単位への倍率(いくらを g で見せるなら 1000)
# range: 1件あたりの総量として妥当な範囲(表示単位。外れたら読み違いとして捨てる)
# 並び順 = サイトに出る順。楽天ふるさと納税で人気のジャンル順にしている
categories:
  - id: rice
    search_word: 米
    name: お米
    emoji: "🍚"
    unit_kind: weight
    unit: kg
    keywords: ["ふるさと納税 米 精米", "ふるさと納税 無洗米"]
    exclude: ["玄米", "パックご飯", "レトルト", "米粉", "日本酒", "甘酒", "もち"]
    range: [2, 60]
  - id: beef
    search_word: 牛肉
    name: 牛肉
    emoji: "🐄"
    unit_kind: weight
    unit: kg
    keywords: ["ふるさと納税 牛肉 切り落とし", "ふるさと納税 牛肉 小間切れ"]
    exclude: ["ハンバーグ", "コロッケ", "メンチ", "カレー", "ビーフジャーキー", "牛タン", "味付", "タレ", "豚", "鶏", "バラエティ"]
    range: [0.3, 10]
  - id: pork
    search_word: 豚肉
    name: 豚肉
    emoji: "🐖"
    unit_kind: weight
    unit: kg
    keywords: ["ふるさと納税 豚肉 小間切れ", "ふるさと納税 豚肉 切り落とし"]
    exclude: ["ハンバーグ", "ウインナー", "ソーセージ", "餃子", "ハム", "ベーコン", "焼売", "メンチ", "とんかつ", "味付", "タレ", "牛", "鶏"]
    range: [0.5, 15]
  - id: chicken
    search_word: 鶏肉
    name: 鶏肉
    emoji: "🐔"
    unit_kind: weight
    unit: kg
    keywords: ["ふるさと納税 鶏肉 もも", "ふるさと納税 鶏むね肉"]
    exclude: ["唐揚げ", "からあげ", "チキン南蛮", "焼き鳥", "焼鳥", "ハム", "サラダチキン", "つくね", "味付", "タレ", "牛", "豚"]
    range: [1, 20]
  - id: scallop
    name: ホタテ
    emoji: "🐚"
    unit_kind: weight
    unit: kg
    keywords: ["ふるさと納税 ホタテ 貝柱", "ふるさと納税 ほたて 冷凍"]
    exclude: ["フライ", "グラタン", "干し", "乾燥", "缶詰", "食べ比べ", "詰め合わせ", "ひも", "えび", "カニ"]
    require: ["ホタテ", "ほたて", "帆立"]
    range: [0.3, 10]
  - id: shrimp
    name: エビ
    emoji: "🦐"
    unit_kind: weight
    unit: kg
    keywords: ["ふるさと納税 むきえび", "ふるさと納税 えび 冷凍"]
    exclude: ["フライ", "天ぷら", "グラタン", "干し", "乾燥", "桜えび", "食べ比べ", "詰め合わせ", "ホタテ", "カニ", "シーフード", "ミックス", "いか", "イカ"]
    require: ["えび", "エビ", "海老"]
    range: [0.3, 10]
  - id: crab
    name: カニ
    emoji: "🦀"
    unit_kind: weight
    unit: kg
    keywords: ["ふるさと納税 ズワイガニ", "ふるさと納税 カニ ポーション"]
    exclude: ["缶詰", "カニカマ", "かにかま", "甲羅", "グラタン", "クリーム", "食べ比べ", "詰め合わせ"]
    require: ["カニ", "かに", "蟹", "ガニ", "がに"]
    range: [0.3, 10]
  - id: ikura
    name: いくら
    emoji: "🟠"
    unit_kind: weight
    scale: 1000
    unit: g
    keywords: ["ふるさと納税 いくら 醤油漬け", "ふるさと納税 いくら 北海道"]
    exclude: ["筋子", "すじこ", "鱒", "食べ比べ", "詰め合わせ", "サーモン", "海宝漬", "ルイベ", "ほたて", "ホタテ", "セット", "松前", "かに", "カニ", "丼"]
    require: ["いくら", "イクラ"]
    range: [100, 3000]
  - id: salmon
    search_word: 鮭
    name: サーモン・鮭
    emoji: "🐟"
    unit_kind: weight
    unit: kg
    keywords: ["ふるさと納税 サーモン 刺身", "ふるさと納税 鮭 切り身"]
    exclude: ["いくら", "フレーク", "燻製", "スモーク", "ルイベ漬", "食べ比べ", "詰め合わせ"]
    require: ["サーモン", "鮭", "しゃけ", "サケ"]
    range: [0.3, 10]
  - id: mikan
    name: みかん
    emoji: "🍊"
    unit_kind: weight
    unit: kg
    keywords: ["ふるさと納税 みかん"]
    exclude: ["ジュース", "ゼリー", "ドライ", "缶詰", "マーマレード", "甘夏", "デコポン", "不知火", "せとか", "はるみ", "ポンカン"]
    require: ["みかん", "蜜柑", "ミカン"]
    range: [2, 30]
  - id: apple
    name: りんご
    emoji: "🍎"
    unit_kind: weight
    unit: kg
    keywords: ["ふるさと納税 りんご"]
    exclude: ["ジュース", "ゼリー", "ドライ", "チップス", "シードル", "ジャム"]
    require: ["りんご", "リンゴ", "林檎"]
    range: [2, 30]
  - id: toilet
    name: トイレットペーパー
    emoji: "🧻"
    unit_kind: count
    count_units: ["ロール"]
    unit: ロール
    keywords: ["ふるさと納税 トイレットペーパー"]
    exclude: ["ティッシュ", "キッチンペーパー", "ペーパータオル"]
    range: [12, 300]
    note: "シングル/ダブル・長さ(倍巻き)の違いは考慮していません。"
  - id: tissue
    search_word: ティッシュ
    name: ティッシュ
    emoji: "📦"
    unit_kind: count
    count_units: ["箱"]
    unit: 箱
    keywords: ["ふるさと納税 ティッシュペーパー"]
    exclude: ["トイレットペーパー", "ウェット", "キッチン"]
    range: [5, 200]
    note: "1箱あたりの枚数の違いは考慮していません。"
  - id: water
    search_word: 水
    name: 水
    emoji: "💧"
    unit_kind: volume
    unit: L
    keywords: ["ふるさと納税 水 2L", "ふるさと納税 天然水"]
    exclude: ["炭酸", "ウォーターサーバー", "お茶", "ジュース", "サーバー"]
    range: [6, 200]
  - id: beer
    name: ビール
    emoji: "🍺"
    unit_kind: volume
    unit: L
    keywords: ["ふるさと納税 ビール 350ml 24本", "ふるさと納税 ビール ケース"]
    exclude: ["ノンアルコール", "グラス", "飲み比べ", "クラフト", "ギフト", "ゼロ", "ノンアル", "ドライゼロ", "ゼロ"]
    require: ["ビール"]
    range: [3, 60]
    note: "20歳未満の飲酒は法律で禁止されています。"
  - id: egg
    search_word: 卵
    name: 卵
    emoji: "🥚"
    unit_kind: count
    count_units: ["個", "玉"]
    unit: 個
    keywords: ["ふるさと納税 卵", "ふるさと納税 たまご"]
    exclude: ["プリン", "カステラ", "燻製", "ピータン", "うずら", "マヨネーズ", "卵焼き"]
    require: ["卵", "たまご", "玉子", "タマゴ"]
    range: [10, 400]
