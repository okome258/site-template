name: 毎日のサイト更新

on:
  schedule:
    # GitHub の定時実行は混雑で数時間遅れることがある。
    # 対策: ①混む「0分・30分」を避けた半端な分 ②時間をずらして2回動かす(どちらかが遅れても朝に間に合う)
    - cron: "23 18 * * *"   # 3:23 JST
    - cron: "47 20 * * *"   # 5:47 JST(予備。データが同じなら変更なしで終わる)
  push:
    branches: [main]
    paths-ignore: ["sites/*/public/**", "sites/*/data/**", "**.md"]
  workflow_dispatch:
    inputs:
      site:
        description: "サイト名(空なら全サイト)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: テスト
        run: python -m pytest -q
      - name: サイトを生成
        id: build
        continue-on-error: true   # 1サイト失敗しても他サイトの更新はコミットする
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          SITE: ${{ inputs.site }}
        run: |
          if [ -n "$SITE" ]; then
            python -m core.build "$SITE"
          else
            python -m core.build --all
          fi
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sites
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "サイト自動更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            # 実行中に main へ別のpushが入ると push が弾かれるので、取り込み直して最大3回やり直す
            for i in 1 2 3; do
              git push && exit 0
              echo "push失敗($i回目)。最新のmainを取り込んで再試行"
              git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
              sleep 5
            done
            exit 1
          fi
      - name: 生成に失敗したサイトがあれば赤にする
        if: steps.build.outcome == 'failure'
        run: exit 1
